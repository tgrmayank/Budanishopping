categories:r=>`<b>${esc(r.name)}</b><small class="sm">Key: ${esc(r.k)} • Order ${r.sort}</small><div class="tags"><span class="bd ${r.active===false?'s-hidden':'s-live'}">${r.active===false?'Inactive':'Active'}</span></div>`,
coupons:r=>`<b>${esc(r.code)}</b><small class="sm">${r.type=='flat'?'₹'+r.value:r.value+'%'} off • Min order ₹${r.min_order}</small><div class="tags"><span class="bd ${r.active===false?'s-hidden':'s-live'}">${r.active===false?'Inactive':'Active'}</span></div>`};
const TITLES={dash:['Dashboard','Overview of your store'],orders:['Orders','Track and update customer orders'],products:['Products','Manage your catalog, sizes, designs and prices'],categories:['Categories','Group your products'],coupons:['Coupons','Create discount codes'],settings:['Store Settings','Name, contact, delivery and banners'],pages:['Website Pages','Edit About, Privacy, Terms and more']};
let tab='dash',CATS=[],ROWS={},EDIT={},PGS={},Q={},OF='all',IMG=[],SZ=[],VAR=[];
const catName=k=>CATS.find(c=>c.k==k)?.name||k||'-';
const loadCats=async()=>CATS=(await sb.from('categories').select('*').order('sort')).data||[];

/* ---------- auth ---------- */
function login(){$('#app').innerHTML=`<div class="lg box"><div class="brand"><i>${ic('lock')}</i></div><h2>Admin Login</h2><p class="sm">Sign in to manage your store</p>${ADMIN_EMAIL?'':'<label>Email</label><input id="em" type="email" autocomplete="username">'}<label>Password</label><input id="pw" type="password" autocomplete="current-password" autofocus onkeydown="if(event.key=='Enter')doLogin()"><button class="p" id="lb" onclick="doLogin()">Sign in</button></div>`}
async function doLogin(){const b=$('#lb');b.disabled=true;b.textContent='Signing in...';const {error}=await sb.auth.signInWithPassword({email:ADMIN_EMAIL||$('#em').value.trim(),password:$('#pw').value});if(error){toast(error.message=='Invalid login credentials'?'Wrong password. Please try again.':error.message,'er');b.disabled=false;b.textContent='Sign in';return}await boot()}
async function out(){await sb.auth.signOut();login()}
async function boot(){if(typeof supabase==='undefined'){$('#app').innerHTML='<div class="lg box"><h3>Could not load Supabase</h3><p class="sm">Check your internet connection, turn off any ad-blocker, then refresh the page.</p></div>';return}
if(!sb){try{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){$('#app').innerHTML='<div class="lg box"><h3>Setup incomplete</h3><p class="sm">The Supabase URL or key is not set correctly in this file.</p></div>';return}}
const {data:{session}}=await sb.auth.getSession();if(!session){login();return}
const {data:ok}=await sb.rpc('is_admin');if(!ok){toast('This account is not an admin','er');await sb.auth.signOut();login();return}shell()}

/* ---------- shell ---------- */
const TABS=[['dash','Dashboard'],['orders','Orders'],['products','Products'],['categories','Categories'],['coupons','Coupons'],['settings','Settings'],['pages','Pages']];
async function shell(){await loadCats();$('#app').innerHTML=`<div class="mh"><div class="brand"><i>${ic('settings')}</i>Admin Panel</div><span><a href="index.html" target="_blank" title="View site"><button>${ic('ext',16)}</button></a><button onclick="out()" title="Logout">${ic('logout',16)}</button></span></div><div class="app"><aside class="sb"><div class="brand"><i>${ic('settings')}</i>Admin Panel</div><nav class="nv">${TABS.map(t=>`<button id="t-${t[0]}" onclick="go('${t[0]}')">${ic(t[0],18)}${t[1]}</button>`).join('')}</nav><div class="ft"><a href="index.html" target="_blank">${ic('ext')}View website</a><button onclick="out()">${ic('logout')}Logout</button></div></aside><div class="mn"><div class="top"><div><h1 id="h1"></h1><p id="h1s"></p></div><div id="ta"></div></div><main id="m"></main></div></div>`;go(tab)}
async function go(t){tab=t;document.querySelectorAll('.nv button').forEach(b=>b.classList.toggle('on',b.id=='t-'+t));$('#h1').textContent=TITLES[t][0];$('#h1s').textContent=TITLES[t][1];$('#ta').innerHTML=NM[t]?`<button class="p" onclick="edit('${t}')">${ic('plus')}Add ${NM[t]}</button>`:'';scrollTo(0,0);$('#m').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';try{await V[t]();if(t=='dash')countUp()}catch(e){console.error(e);$('#m').innerHTML=`<div class="em">${ic('alert',32)}Something went wrong: ${esc(e.message)}</div>`}}

/* ---------- lists ---------- */
const crud=t=>async()=>{const {data,error}=await sb.from(t).select('*').order(t=='products'?'created_at':t=='categories'?'sort':'code',{ascending:t!='products'});if(error)throw error;ROWS[t]=data||[];Q[t]='';
$('#m').innerHTML=`<div class="tb"><div class="srch">${ic('search',16)}<input placeholder="Search ${t}..." oninput="Q['${t}']=this.value;drawList('${t}')"></div></div><div id="lst"></div>`;drawList(t)};
function drawList(t){const q=(Q[t]||'').toLowerCase(),h=ROWS[t].map((r,i)=>[r,i]).filter(([r])=>JSON.stringify([r.name,r.k,r.code,r.category]).toLowerCase().includes(q)).map(([r,i])=>`<div class="row ${r.active===false?'off':''}">${t=='products'?(r.images?.[0]?`<img class="thumb" src="${esc(r.images[0])}" alt="">`:`<span class="thumb">${ic('image')}</span>`):''}<div class="inf">${SUM[t](r)}</div><div class="acts"><button onclick="edit('${t}',${i})">${ic('edit',16)}Edit</button><button class="d" onclick="del('${t}',${i})" title="Delete">${ic('trash',16)}</button></div></div>`).join('');
$('#lst').innerHTML=h||`<div class="em">${ic(t,34)}${q?'No results found':'Nothing here yet. Click “Add '+NM[t]+'” to create one.'}</div>`}

/* ---------- add / edit ---------- */
function edit(t,i){const r=i==null?{active:true,type:'percent',min_order:0,sort:CATS.length+1,category:CATS[0]?.k}:ROWS[t][i];EDIT={t,i};SZALL=false;IMG=[...(r.images||[])];while(IMG.length<4)IMG.push('');VAR=(r.variants||[]).map(v=>({name:v.name||'',price:v.price??'',mrp:v.mrp??'',images:[...(v.images||[]),'','','',''].slice(0,4)}));SZ=[...(r.sizes||[])];
const h=F[t].map(f=>{if(f.length==1)return `<div class="fs">${f[0]}</div>`;const [k,l,ty,hn,rq]=f,v=r[k],lb=`<label for="f-${k}">${l}${rq||(t=='products'&&k=='price')?'<span class="rq"> *</span>':''}${hn?`<span class="hint">${hn}</span>`:''}</label>`;let x;
if(ty=='c')return `<label class="ck"><input type="checkbox" id="f-${k}" ${v===false?'':'checked'}> ${l}</label>`;
if(ty=='a')x=`<textarea id="f-${k}" rows="3">${esc(v||'')}</textarea>`;
else if(ty=='cat')x=`<select id="f-${k}" onchange="drawSz()">${CATS.map(c=>`<option value="${esc(c.k)}" ${c.k==v?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
else if(ty=='sz')x=`<div id="szbox" class="sel"></div>`;
else if(ty=='var')x=`<div id="vbox"></div><button type="button" class="p" style="width:100%;margin-top:10px" onclick="addVar()">${ic('plus')}Add design / color</button>`;
else if(ty=='img')x=`<div id="slots" class="slots"></div>`;
else if(ty[0]=='s')x=`<select id="f-${k}">${ty.slice(2).split(',').map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select>`;
else x=`<input id="f-${k}" type="${ty=='n'?'number':'text'}" step="any" value="${esc(v??'')}" ${i!=null&&k==PK[t]?'readonly':''}>`;
return lb+x}).join('');
$('#md').innerHTML=`<div class="ov"><div class="sheet"><div class="sh"><h3>${i==null?'Add':'Edit'} ${NM[t]}</h3><button onclick="closeM()" title="Close">${ic('x')}</button></div><div class="sbd">${h}</div><div class="sf"><button onclick="closeM()">Cancel</button><button class="p" onclick="save()">${ic('save')}Save ${NM[t]}</button></div></div></div>`;drawSlots();drawSz();drawVars()}
const closeM=()=>$('#md').innerHTML='';
async function save(){const {t,i}=EDIT,o={};
for(const f of F[t]){if(f.length==1)continue;const [k,l,ty]=f;if(ty=='img'){o[k]=IMG.map(x=>x.trim()).filter(Boolean);continue}
if(ty=='sz'){o[k]=SZ.length?[...SZP.filter(x=>SZ.includes(x)),...SZ.filter(x=>!SZP.includes(x))]:null;continue}
if(ty=='var'){o[k]=VAR.filter(v=>String(v.name).trim()).map(v=>({name:String(v.name).trim(),price:v.price===''||v.price==null?null:+v.price,mrp:v.mrp===''||v.mrp==null?null:+v.mrp,images:v.images.filter(Boolean)}));continue}
const e=$('#f-'+k);let v=ty=='c'?e.checked:e.value.trim();if(ty=='n')v=v===''?null:+v;o[k]=v}
if(t=='categories')o.k=o.k.toLowerCase().replace(/[^a-z0-9_-]/g,'');if(t=='coupons')o.code=o.code.toUpperCase();
if(t=='products'&&o.variants.length){if(o.variants.some(v=>v.price==null)){toast('Please enter a price for every design','er');return}const f=o.variants[0];o.price=f.price;o.mrp=f.mrp;if(f.images.length)o.images=f.images}
if(!o[F[t][1][0]]||(t=='products'&&o.price==null)){toast('Please fill in all required fields (*)','er');return}
const {error}=i==null?await sb.from(t).insert(o):await sb.from(t).update(o).eq(PK[t],ROWS[t][i][PK[t]]);
if(error){toast(error.message,'er');return}closeM();toast('Saved successfully');if(t=='categories')await loadCats();go(tab)}
async function del(t,i){if(!await ask('Delete this '+(NM[t]||'order')+'?','This cannot be undone.'))return;const {error}=await sb.from(t).delete().eq(PK[t],ROWS[t][i][PK[t]]);if(error){toast(error.message,'er');return}toast('Deleted');if(t=='categories')await loadCats();go(tab)}

/* ---------- sizes ---------- */
function drawSz(){const el=$('#szbox');if(!el)return;const kd=szKinds(),rec=kd&&!SZALL,grp=(rec?kd:SZG.map((_,i)=>i)).map(i=>SZG[i]),shown=grp.flatMap(g=>g[1]),extra=SZ.filter(x=>!shown.includes(x)),cn=catName($('#f-category')?.value);
if(extra.length)grp.push(['Other selected / custom',extra]);
el.innerHTML=(kd?`<div class="rw"><span class="sm">${rec?'Showing sizes for <b>'+esc(cn)+'</b>':'Showing all sizes'}</span><button type="button" style="padding:5px 10px;font-size:12px" onclick="SZALL=${!rec};drawSz()">${rec?'Show all sizes':'Show recommended'}</button></div>`:'')+grp.map(([n,a])=>`<div class="sg">${n}</div><div class="chipz">${a.map(x=>`<button type="button" class="cz ${SZ.includes(x)?'on':''}" data-s="${esc(x)}" onclick="togSz(this.dataset.s)">${SZ.includes(x)?ic('check',14):''}${esc(x)}</button>`).join('')}</div>`).join('')+`<div class="sg">Add custom size</div><div class="rw" style="flex-wrap:nowrap"><input id="szc" placeholder="e.g. 42, 44 or 2XL" onkeydown="if(event.key=='Enter'){event.preventDefault();addSz()}"><button type="button" class="p" onclick="addSz()">${ic('plus',16)}Add</button></div><div class="rw" style="margin-top:10px"><span class="sm"><b>${SZ.length}</b> selected${SZ.length?': '+esc(SZ.join(', ')):''}</span>${SZ.length?`<button type="button" class="d" style="padding:5px 10px" onclick="SZ=[];drawSz()">Clear all</button>`:''}</div>`}
function togSz(x){SZ=SZ.includes(x)?SZ.filter(y=>y!=x):[...SZ,x];drawSz()}
function addSz(){$('#szc').value.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!SZ.includes(x))SZ.push(x)});drawSz()}

/* ---------- photos & designs ---------- */
async function shrink(f){try{const b=await createImageBitmap(f),r=Math.min(1,1200/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*r);c.height=Math.round(b.height*r);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(bl=>ok(bl||f),'image/jpeg',.86))}catch(e){return f}}
async function upImg(f){toast('Uploading photo...');const b=await shrink(f),p=Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg';
const {error}=await sb.storage.from('media').upload(p,b,{contentType:b.type||'image/jpeg',upsert:true});if(error){toast('Upload failed: '+error.message,'er');return null}
return sb.storage.from('media').getPublicUrl(p).data.publicUrl}
const slotHtml=(u,n,clr,up,lab)=>`<div class="slot">${u?`<img src="${esc(u)}" alt="" onerror="this.outerHTML='<span class=bad>Not loading</span>'"><button type="button" class="x" onclick="${clr}" title="Remove">${ic('x',14)}</button>`:`<label>${ic('upload',20)}${lab}<input type="file" accept="image/*" hidden onchange="${up}"></label>`}</div>`;
async function vUp(inp,i,n){const f=inp.files[0];if(!f)return;const u=await upImg(f);if(u){VAR[i].images[n]=u;drawVars();toast('Photo uploaded. Remember to save.')}}
async function slotUp(inp,n){const f=inp.files[0];if(!f)return;const u=await upImg(f);if(u){IMG[n]=u;drawSlots();toast('Photo uploaded. Remember to save.')}}
const slotClr=n=>{IMG[n]='';drawSlots()},vClr=(i,n)=>{VAR[i].images[n]='';drawVars()};
function drawSlots(){const el=$('#slots');if(!el)return;el.innerHTML=IMG.map((u,n)=>slotHtml(u,n,`slotClr(${n})`,`slotUp(this,${n})`,n==0?'Main':'Photo '+(n+1))).join('')}
function addVar(){VAR.push({name:'',price:'',mrp:'',images:['','','','']});drawVars()}
async function delVar(i){if(await ask('Remove this design?','Its photos and price will be removed after you save.','Remove')){VAR.splice(i,1);drawVars()}}
function drawVars(){const el=$('#vbox');if(!el)return;
el.innerHTML=VAR.map((v,i)=>`<div class="vc"><div class="rw"><b>${ic('palette',16)} Design ${i+1}</b><button type="button" class="d" style="padding:6px 10px" onclick="delVar(${i})">${ic('trash',15)}Remove</button></div><input placeholder="Design / color name (e.g. Black, Red Graphic)" value="${esc(v.name)}" oninput="VAR[${i}].name=this.value"><div class="two2"><input type="number" step="any" placeholder="Price ₹ *" value="${esc(v.price)}" oninput="VAR[${i}].price=this.value"><input type="number" step="any" placeholder="MRP ₹ (optional)" value="${esc(v.mrp)}" oninput="VAR[${i}].mrp=this.value"></div><div class="slots">${v.images.map((u,n)=>slotHtml(u,n,`vClr(${i},${n})`,`vUp(this,${i},${n})`,n==0?'Main':'Photo '+(n+1))).join('')}</div></div>`).join('')||`<p class="sm">No designs yet. Add one if each color or design needs its own photos and price.</p>`}
async function upl(inp,id){const e=$('#'+id),f=inp.files[0];if(!f)return;const u=await upImg(f);if(u){e.value=u;toast('Logo uploaded. Remember to save.');prev(id)}inp.value=''}
const badImg=i=>{const m=document.createElement('span');m.className='bad';m.textContent='Image not loading. Make sure the Supabase bucket is public.';i.replaceWith(m)};
function prev(id){const el=$('#pv-'+id),e=$('#'+id);if(!el||!e)return;el.innerHTML=e.value.trim()?`<img class="thumb" style="margin-top:8px;width:72px;height:72px" src="${esc(e.value.trim())}" alt="" onerror="badImg(this)">`:''}

/* ---------- views ---------- */
function countUp(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;document.querySelectorAll('[data-n]').forEach(e=>{const t=+e.dataset.n,p=e.dataset.p||'',s=performance.now();(function f(n){const k=Math.min(1,(n-s)/800);e.textContent=p+Math.round(t*(1-Math.pow(1-k,3))).toLocaleString('en-IN');if(k<1)requestAnimationFrame(f)})(s)})}

const orderCard=(o,n)=>`<div class="box od"><div class="rw"><b style="color:var(--n)">#${esc(o.order_id)}</b><span class="bd s-${o.status}">${nice(o.status)}</span></div><p class="sm" style="margin:2px 0 8px">${new Date(o.created_at).toLocaleString('en-IN')}</p><p>${ic('phone',16)}<span>${esc(o.customer_name)} • <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></span></p><p class="sm">${ic('pin',16)}<span>${esc(o.address)}</span></p><div class="it">${(o.items||[]).map(i=>`<div><span>${esc(i.name)} • ${esc(i.size)}${i.color?' • '+esc(i.color):''} × ${i.qty}</span><b>₹${i.price*i.qty}</b></div>`).join('')}</div><p class="sm">Subtotal ₹${o.subtotal} • Discount ₹${o.discount}${o.coupon?' ('+esc(o.coupon)+')':''} • Delivery ₹${o.delivery} • ${esc(o.payment_method)}</p><div class="rw tot"><b>Total ₹${o.total}</b><span style="display:flex;gap:6px"><select onchange="ost(${n},this.value)" aria-label="Order status">${ST.map(s=>`<option value="${s}" ${s==o.status?'selected':''}>${nice(s)}</option>`).join('')}</select><button class="d" onclick="del('orders',${n})" title="Delete order">${ic('trash',16)}</button></span></div></div>`;
const V={
dash:async()=>{const {data}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(200),o=data||[];ROWS.orders=o;const live=o.filter(x=>x.status!='cancelled');
const cards=[['orders','c1','Total orders',o.length],['alert','c2','New orders',o.filter(x=>x.status=='placed').length],['rupee','c3','Revenue',live.reduce((a,x)=>a+ +x.total,0)],['products','c4','Products',await cnt('products')],['coupons','c5','Coupons',await cnt('coupons')]];
$('#m').innerHTML=`<div class="g">${cards.map(([i,c,a,b])=>`<div class="st"><i class="${c}">${ic(i,22)}</i><div><b data-n="${b}" data-p="${a=='Revenue'?'₹':''}">${b}</b><small>${a}</small></div></div>`).join('')}</div><div class="rw"><h2 class="sec">Recent orders</h2>${o.length?`<button onclick="go('orders')">View all</button>`:''}</div>${o.slice(0,3).map((x,n)=>orderCard(x,n)).join('')||`<div class="em">${ic('orders',34)}No orders yet</div>`}`},
orders:async()=>{const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(200);if(error)throw error;ROWS.orders=data||[];Q.orders='';OF='all';
$('#m').innerHTML=`<div class="tb"><div class="srch">${ic('search',16)}<input placeholder="Search by order ID, name or phone..." oninput="Q.orders=this.value;drawOrders()"></div></div><div class="chips" id="oc"></div><div id="lst"></div>`;drawOrders()}
,products:crud('products'),categories:crud('categories'),coupons:crud('coupons'),
settings:async()=>{const {data}=await sb.from('settings').select('value').eq('key','site').maybeSingle(),x=data?.value||{};
const f=(k,l,ty='text',h='')=>`<label for="s-${k}">${l}${h?`<span class="hint">${h}</span>`:''}</label><input id="s-${k}" type="${ty}" value="${esc(x[k]??'')}">`;
$('#m').innerHTML=`<div class="box"><h3>${ic('info')}Store details</h3>${f('name','Store name')}${f('short','Header short name')}${f('tagline','Tagline')}${f('phone','Phone number','text','Shown to customers exactly as typed.')}${f('wa','WhatsApp number','text','Include country code, e.g. 918923538910')}</div>
<div class="box"><h3>${ic('rupee')}Delivery</h3>${f('free_ship','Free delivery above (₹)','number')}${f('ship','Delivery charge (₹)','number')}</div>
<div class="box"><h3>${ic('image')}Branding</h3><label for="s-logo">Logo<span class="hint">Upload an image or paste a URL.</span></label><input id="s-logo" value="${esc(x.logo||'')}" oninput="prev('s-logo')"><input type="file" accept="image/*" onchange="upl(this,'s-logo')"><div id="pv-s-logo"></div><label for="s-ticker">Scrolling ticker lines<span class="hint">One line per message.</span></label><textarea id="s-ticker" rows="4">${esc((x.ticker||[]).join('\n'))}</textarea></div>
<div class="box"><h3>${ic('palette')}Festival banner</h3><label class="ck"><input type="checkbox" id="s-diwali" ${x.diwali===false?'':'checked'}> Show festival banner</label>${f('fest_title','Banner title')}${f('fest_sub','Banner subtitle')}</div>
<button class="p" onclick="saveS()">${ic('save')}Save settings</button>`;prev('s-logo')},
pages:async()=>{const {data}=await sb.from('settings').select('value').eq('key','pages').maybeSingle();PGS=data?.value||{};
$('#m').innerHTML=`<div class="box"><p class="sm" style="margin-bottom:6px">${ic('info',14)} Leave the content empty to keep the built-in default text. HTML is allowed. Custom Support / Contact content replaces the built-in buttons and form.</p><label for="p-k">Page</label><select id="p-k" onchange="pfill()">${['about','privacy','terms','support','contact'].map(k=>`<option value="${k}">${k[0].toUpperCase()+k.slice(1)}</option>`).join('')}</select><label for="p-t">Title</label><input id="p-t"><label for="p-s">Subtitle</label><input id="p-s"><label for="p-h">Content (HTML)</label><textarea id="p-h" rows="12"></textarea><button class="p" style="margin-top:14px" onclick="saveP()">${ic('save')}Save page</button></div>`;pfill()}};

$('#oc').innerHTML=['all',...ST].map(s=>`<button class="${OF==s?'on':''}" style="text-transform:capitalize" onclick="OF='${s}';drawOrders()">${nice(s)} (${s=='all'?all.length:all.filter(o=>o.status==s).length})</button>`).join('');
const h=all.map((o,n)=>[o,n]).filter(([o])=>(OF=='all'||o.status==OF)&&JSON.stringify([o.order_id,o.customer_name,o.phone]).toLowerCase().includes(q)).map(([o,n])=>orderCard(o,n)).join('');
$('#lst').innerHTML=h||`<div class="em">${ic('orders',34)}No orders found</div>`}

async function saveS(){const g=k=>$('#s-'+k).value.trim(),o={};
['name','short','tagline','phone','wa','logo','fest_title','fest_sub'].forEach(k=>o[k]=g(k));
['free_ship','ship'].forEach(k=>o[k]=g(k)===''?null:+g(k));o.ticker=g('ticker').split('\n').map(x=>x.trim()).filter(Boolean);o.diwali=$('#s-diwali').checked;
const {error}=await sb.from('settings').upsert({key:'site',value:o,updated_at:new Date().toISOString()});error?toast(error.message,'er'):toast('Settings saved')}
function pfill(){const p=PGS[$('#p-k').value]||{};$('#p-t').value=p.title||'';$('#p-s').value=p.sub||'';$('#p-h').value=p.html||''}
async function saveP(){const k=$('#p-k').value,h=$('#p-h').value.trim();if(h)PGS[k]={title:$('#p-t').value.trim(),sub:$('#p-s').value.trim(),html:h};else delete PGS[k];
const {error}=await sb.from('settings').upsert({key:'pages',value:PGS,updated_at:new Date().toISOString()});error?toast(error.message,'er'):toast('Page saved')}
boot();
</script></body></html>
