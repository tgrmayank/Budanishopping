let P=[],demo=false,Q={q:'',cat:'',sort:'',max:''},cart=ls.g('bd_cart',[]),coupon=null,sel={},pay='cod',tm,lastH='';

function demoP(){const n={tshirt:['Classic Tee','Oversized Tee','Graphic Tee'],hoodie:['Zip Hoodie','Fleece Hoodie','Street Hoodie'],lower:['Jogger','Cargo Lower','Track Pant'],shoe:['Runner Shoe','Sneaker','Casual Shoe']},cl=['#0b1f5c','#e3a400','#333','#7a1f3d'];let id=1;

const S={};
function applySite(){const x=S.site||{},n=x.name||'BUDANI SHOPPING';
if(x.phone)CFG.PHONE=x.phone;if(x.wa)CFG.WA=x.wa;if(x.free_ship!=null)CFG.FREE_SHIP=+x.free_ship;if(x.ship!=null)CFG.SHIP=+x.ship;if(x.logo)LOGO=x.logo;
document.title=n;document.querySelectorAll('.bnm').forEach(e=>e.textContent=n);$('#bns').textContent=x.short||'BUDANI';$('#ftg').textContent=x.tagline||'BE UNIQUE, STAY SPECIAL.';
document.querySelectorAll('.lg').forEach(i=>i.src=LOGO);
$('#fsh').innerHTML='<h4>SHOP</h4>'+CATS.map(c=>`<a href="#c/${esc(c.k)}">${esc(c.n)}</a>`).join('');
$('#fct').innerHTML=`<h4>CONTACT</h4><a href="tel:${CFG.PHONE.replace(/ /g,'')}">Call: ${esc(CFG.PHONE)}</a><a href="https://wa.me/${CFG.WA}">WhatsApp: ${esc(CFG.PHONE)}</a>`}
async function loadS(){if(sb){try{const [a,b]=await Promise.all([sb.from('settings').select('*'),sb.from('categories').select('*').eq('active',true).order('sort')]);
(a.data||[]).forEach(r=>S[r.key]=r.value);if(b.data?.length)CATS.splice(0,CATS.length,...b.data.map(c=>({k:c.k,n:c.name})));
Object.entries(S.pages||{}).forEach(([k,v])=>{if(PG[k]&&v?.html)PG[k]=[v.title||PG[k][0],v.html,v.sub??PG[k][2]]})}catch(e){console.error(e)}}applySite()}

const sizesOf=p=>p.sizes?.length?p.sizes:p.category=='shoe'?['6','7','8','9','10']:['S','M','L','XL','XXL'];

let route='home',stack=[];try{route=(location.hash||'#home').slice(1)||'home'}catch(e){}
function go(r){if(r==route){render();return}stack.push(route);route=r;try{history.pushState(null,'','#'+r)}catch(e){}drw(0);render()}
function back(){route=stack.pop()||'home';render()}

function diwali(){let b='',g='',w='',p='',i=0;
const L=(x0,x1,y0,sg,n,f)=>{for(let j=1;j<=n;j++){const u=j/(n+1);f((x0+(x1-x0)*u).toFixed(2),(y0+4*sg*u*(1-u)).toFixed(1),j)}};
for(let k=0;k<5;k++){const x0=k*20,x1=x0+20;w+=(k?'':'M0 34')+` Q${x0+10} 86 ${x1} 34`;L(x0,x1,34,26,3,(x,y)=>{i++;b+=`<i class="bu" style="left:${x}%;top:${y}px;animation-delay:-${(i*.9%8).toFixed(1)}s,-${(i*.37%1.4).toFixed(2)}s"></i>`})}
for(let k=0;k<4;k++)L(k*25,k*25+25,6,14,9,(x,y)=>{g+=`<i class="mg" style="left:${x}%;top:${y}px"></i>`});
for(let k=0;k<5;k++)g+=`<i class="mg big" style="left:${k*25}%;top:6px"></i>`;
